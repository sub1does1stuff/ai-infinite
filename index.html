<title>Infinite Knowledge Page</title>

<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    textarea {
        width: 100%;
        height: 100vh;
        border: none;
        outline: none;
        resize: none;
        background: #111;
        color: white;
        padding: 30px;
        box-sizing: border-box;
        font-size: 18px;
        line-height: 1.6;
        font-family: Arial, sans-serif;
    }
</style>
</head>

<body>

<textarea id="editor" placeholder="Paste or type information here..."></textarea>

<script>
const editor = document.getElementById("editor");

window.onload = () => {
    const saved = localStorage.getItem("infinite_ai_page");
    if (saved) {
        editor.value = saved;
    }
};

editor.addEventListener("input", () => {
    localStorage.setItem("infinite_ai_page", editor.value);
});
</script>

</body>
</html>
